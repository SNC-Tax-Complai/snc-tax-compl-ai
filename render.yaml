services:
  # ── Backend API — always live (starter plan, Frankfurt) ─────────────────────
  - type: web
    name: snc-compl-ai-backend
    runtime: docker
    dockerfilePath: ./snc-tax-backend/Dockerfile
    dockerContext: ./snc-tax-backend
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      # ── Database: set via Render dashboard or use DATABASE_URL ──────────────
      - key: DATABASE_URL
        sync: false      # paste: postgresql://doadmin:PASS@HOST:25060/defaultdb?sslmode=require
      - key: DATABASE_SSL
        value: "true"
      # ── Auth ─────────────────────────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      # ── CORS: allow all origins (tighten after custom domain is set) ─────────
      - key: CORS_ORIGIN
        value: "*"
      # ── Integrations (mock/stub until wired up) ────────────────────────────
      - key: SARS_MOCK_MODE
        value: "true"
      - key: AI_PROVIDER_DEFAULT
        value: mock
      - key: LOG_LEVEL
        value: info

  # ── Frontend Static Site — free tier, always live ───────────────────────────
  - type: web
    name: snc-compl-ai-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    rootDir: snc-tax-frontend
    plan: free
    region: frankfurt
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    buildFilter:
      paths:
        - snc-tax-frontend/**
    envVars:
      # Points frontend axios client to the backend service
      - key: VITE_API_URL
        value: https://snc-compl-ai-backend.onrender.com/api
