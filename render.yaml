services:
  # ── Backend API — always live (starter = no sleep) ───────────────────────
  - type: web
    name: snc-compl-ai-backend
    runtime: docker
    dockerfilePath: ./snc-tax-backend/Dockerfile
    dockerContext: ./snc-tax-backend
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: CORS_ORIGIN
        value: "*"
      - key: SARS_MOCK_MODE
        value: "true"
      - key: AI_PROVIDER_DEFAULT
        value: mock
      - key: LOG_LEVEL
        value: info

  # ── Frontend — static site, always live ──────────────────────────────────
  - type: web
    name: snc-compl-ai-frontend
    runtime: static
    # No rootDir — use explicit cd so paths are unambiguous
    buildCommand: cd snc-tax-frontend && npm install && npm run build
    staticPublishPath: snc-tax-frontend/dist
    plan: free
    region: frankfurt
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: VITE_API_URL
        value: https://snc-compl-ai-backend.onrender.com/api
